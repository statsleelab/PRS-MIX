# Miami University RedHawk cluster — SLURM-backed.
#
# Source of truth for account/partition/conda-env bindings for this repo.
# Update here when bindings change; do not duplicate them in ad hoc
# submission scripts.
#
# Host/scheduler facts (host, scheduler, partitions, account/qos policy)
# were confirmed live for user koogc on 2026-09-03 against this same
# physical cluster from a sibling project (DefiSurv), not re-probed from
# this repo specifically. Re-verify with `ssh redhawk` + `sacctmgr`/
# `scontrol show partition` if anything below looks stale.
#
#   - sbatch/squeue/qsub present -> scheduler: slurm
#   - `sacctmgr show assoc user=koogc` returns nothing and
#     `scontrol show partition batch` reports AllowAccounts=ALL,
#     AllowQos=ALL, QoS=N/A -> no account/qos association is enforced,
#     so this profile leaves both blank.
#   - partitions available: batch (default, 20-00:00:00, 33 nodes/808
#     cpus), gpu, bigmem, serial_onecore, webmo.

name: redhawk
scheduler: slurm

# Connection (passwordless via ~/.ssh/config `Host redhawk` alias)
host: redhawk.hpc.muohio.edu
user: koogc

# Repo location on the cluster — shared group storage, not $HOME.
# NOTE: this is where `gauss3` (the base package this repo forked from) is
# synced today. PRS-MIX has not yet been synced to RedHawk as its own
# checkout — update this path once it is (e.g. a sibling
# `.../grace/github/PRS-MIX` directory), rather than reusing gauss3's path.
project_root: /shared/leed13_shared/grace/github/gauss3  # TODO: point at PRS-MIX's own checkout once synced

# Submission resources — no account/qos association exists on this
# cluster; left blank since AllowAccounts=ALL / AllowQos=ALL / QoS=N/A.
account: ""
qos: ""
partition: batch
wall_time: "04:00:00"
ntasks: 1
cores: 2
mem_gb: 4

# Environment — R package with Rcpp/RcppEigen/hdf5r; PRS-CS mixing scripts
# are Python (inst/prscs-mix/).
modules: []
conda_env: prscs
